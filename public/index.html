<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>StrikeCall</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e17">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  body {
    background: linear-gradient(160deg,#0a0e17 0%,#0d1420 100%);
    color:#e8edf5; min-height:100vh; padding-bottom:40px;
  }
  header {
    padding:24px 20px 16px; text-align:center;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  header h1 {
    font-size:26px; font-weight:800; letter-spacing:-0.5px;
    background:linear-gradient(90deg,#4ade80,#22c55e);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header p { color:#8b95a8; font-size:13px; margin-top:4px; }

  .search-wrap { padding:18px 16px 6px; position:relative; }
  #searchInput {
    width:100%; padding:14px 16px; border-radius:14px; border:1px solid rgba(255,255,255,0.1);
    background:#141b28; color:#fff; font-size:16px; outline:none;
  }
  #searchInput:focus { border-color:#22c55e; }
  #suggestions {
    position:absolute; left:16px; right:16px; top:64px; background:#141b28;
    border:1px solid rgba(255,255,255,0.1); border-radius:14px; overflow:hidden;
    z-index:10; max-height:280px; overflow-y:auto; display:none;
  }
  .suggestion-item {
    display:flex; align-items:center; gap:12px; padding:12px 14px;
    border-bottom:1px solid rgba(255,255,255,0.05); cursor:pointer;
  }
  .suggestion-item:hover, .suggestion-item:active { background:#1c2536; }
  .suggestion-item img { width:28px; height:28px; border-radius:6px; background:#fff; object-fit:contain; }
  .suggestion-item .sym { font-weight:700; font-size:14px; }
  .suggestion-item .name { font-size:12px; color:#8b95a8; }

  #loading { text-align:center; padding:40px 20px; color:#8b95a8; display:none; }
  #error { text-align:center; padding:20px; color:#f87171; display:none; }

  #results { padding:20px 16px; display:none; }

  .card-header {
    display:flex; align-items:center; gap:12px; margin-bottom:18px;
  }
  .card-header img { width:44px; height:44px; border-radius:10px; background:#fff; object-fit:contain; }
  .card-header .sym { font-size:22px; font-weight:800; }
  .card-header .price { font-size:22px; font-weight:800; color:#4ade80; margin-left:auto; }

  .stat-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;
  }
  .stat-box {
    background:#141b28; border-radius:14px; padding:14px; border:1px solid rgba(255,255,255,0.06);
  }
  .stat-box .label { font-size:11px; color:#8b95a8; text-transform:uppercase; letter-spacing:0.5px; }
  .stat-box .value { font-size:19px; font-weight:800; margin-top:4px; }

  .strike-card {
    background:linear-gradient(135deg,#14532d,#16803d);
    border-radius:16px; padding:20px; margin-bottom:22px; text-align:center;
  }
  .strike-card .label { font-size:12px; text-transform:uppercase; letter-spacing:1px; opacity:0.85; }
  .strike-card .strike-value { font-size:34px; font-weight:900; margin-top:6px; }
  .strike-card .sub { font-size:12px; opacity:0.85; margin-top:6px; }

  .section-title { font-size:14px; font-weight:700; color:#8b95a8; margin-bottom:10px; text-transform:uppercase; letter-spacing:0.5px; }

  .earning-row {
    display:flex; justify-content:space-between; align-items:center;
    background:#141b28; border-radius:12px; padding:12px 14px; margin-bottom:8px;
    border:1px solid rgba(255,255,255,0.06);
  }
  .earning-row .date { font-size:13px; color:#c5cdd9; }
  .earning-row .move { text-align:right; }
  .earning-row .move .dollar { font-weight:800; font-size:14px; }
  .earning-row .move .percent { font-size:11px; }
  .up { color:#4ade80; }
  .down { color:#f87171; }

  .install-hint {
    margin:20px 16px 0; padding:12px 14px; background:#141b28; border-radius:12px;
    font-size:12px; color:#8b95a8; text-align:center; border:1px solid rgba(255,255,255,0.06);
  }
</style>
</head>
<body>

<header>
  <h1>StrikeCall</h1>
  <p>Earnings history &amp; strike sugerido para Calls</p>
</header>

<div class="search-wrap">
  <input type="text" id="searchInput" placeholder="Escribe un ticker o empresa (ej. AAPL)" autocomplete="off">
  <div id="suggestions"></div>
</div>

<div id="loading">Buscando datos de earnings...</div>
<div id="error"></div>

<div id="results">
  <div class="card-header">
    <img id="companyLogo" src="" alt="">
    <div class="sym" id="companySymbol"></div>
    <div class="price" id="companyPrice"></div>
  </div>

  <div class="strike-card">
    <div class="label">Strike sugerido para Call</div>
    <div class="strike-value" id="suggestedStrike">--</div>
    <div class="sub" id="strikeSub">precio actual + movimiento promedio</div>
  </div>

  <div class="stat-grid">
    <div class="stat-box">
      <div class="label">Movimiento promedio</div>
      <div class="value" id="avgMove">--</div>
    </div>
    <div class="stat-box">
      <div class="label">Positivos</div>
      <div class="value" id="positiveCount">--</div>
    </div>
  </div>

  <div class="section-title">Últimos 4 earnings</div>
  <div id="earningsList"></div>
</div>

<div class="install-hint">📲 Instala esta app: menú del navegador → "Agregar a pantalla de inicio"</div>

<script>
const BACKEND_URL = "/.netlify/functions";

const searchInput = document.getElementById("searchInput");
const suggestionsBox = document.getElementById("suggestions");
const loadingEl = document.getElementById("loading");
const errorEl = document.getElementById("error");
const resultsEl = document.getElementById("results");

let debounceTimer;

searchInput.addEventListener("input", () => {
  clearTimeout(debounceTimer);
  const q = searchInput.value.trim();
  if (q.length < 1) {
    suggestionsBox.style.display = "none";
    return;
  }
  debounceTimer = setTimeout(() => fetchSuggestions(q), 300);
});

async function fetchSuggestions(q) {
  try {
    const res = await fetch(`${BACKEND_URL}/search?q=${encodeURIComponent(q)}`); // /.netlify/functions/search
    const data = await res.json();
    if (!Array.isArray(data) || data.length === 0) {
      suggestionsBox.style.display = "none";
      return;
    }
    suggestionsBox.innerHTML = data.map(item => `
      <div class="suggestion-item" onclick="selectTicker('${item.symbol}')">
        <img src="${item.logo || ''}" onerror="this.style.display='none'">
        <div>
          <div class="sym">${item.symbol}</div>
          <div class="name">${item.name}</div>
        </div>
      </div>
    `).join("");
    suggestionsBox.style.display = "block";
  } catch (e) {
    suggestionsBox.style.display = "none";
  }
}

async function selectTicker(symbol) {
  searchInput.value = symbol;
  suggestionsBox.style.display = "none";
  resultsEl.style.display = "none";
  errorEl.style.display = "none";
  loadingEl.style.display = "block";

  try {
    const res = await fetch(`${BACKEND_URL}/earnings/${symbol}`); // /.netlify/functions/earnings/AAPL
    const data = await res.json();
    loadingEl.style.display = "none";

    if (data.error) {
      errorEl.textContent = data.error;
      errorEl.style.display = "block";
      return;
    }

    renderResults(data, symbol);
  } catch (e) {
    loadingEl.style.display = "none";
    errorEl.textContent = "Error conectando con el servidor. Verifica el backend.";
    errorEl.style.display = "block";
  }
}

function renderResults(data, symbol) {
  document.getElementById("companySymbol").textContent = data.symbol;
  document.getElementById("companyPrice").textContent = `$${data.current_price}`;
  document.getElementById("suggestedStrike").textContent = `$${data.suggested_call_strike}`;
  document.getElementById("strikeSub").textContent =
    `precio actual $${data.current_price} + movimiento promedio $${data.avg_move_dollar}`;
  document.getElementById("avgMove").textContent =
    `$${data.avg_move_dollar} (${data.avg_move_percent}%)`;
  document.getElementById("positiveCount").textContent =
    `${data.positive_count}/${data.total_count}`;

  const list = document.getElementById("earningsList");
  list.innerHTML = data.earnings_history.map(e => `
    <div class="earning-row">
      <div class="date">${e.date}</div>
      <div class="move">
        <div class="dollar ${e.direction}">${e.direction === 'up' ? '▲' : '▼'} $${Math.abs(e.gap_dollar)}</div>
        <div class="percent ${e.direction}">${e.gap_percent}%</div>
      </div>
    </div>
  `).join("");

  resultsEl.style.display = "block";
}

document.addEventListener("click", (e) => {
  if (!e.target.closest(".search-wrap")) {
    suggestionsBox.style.display = "none";
  }
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>

</body>
</html>
